name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Copy frontend to server/static
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            if exist server\static rmdir /s /q server\static
            xcopy /E /I /Y client\dist server\static
          else
            rm -rf server/static
            cp -r client/dist server/static
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: server
        run: |
          uv sync

      - name: Add PyInstaller
        working-directory: server
        run: |
          uv add --dev pyinstaller

      - name: Build binary with PyInstaller
        working-directory: server
        run: |
          uv run pyinstaller motility-analyzer.spec --clean

      - name: Upload macOS binary
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: motility-analyzer-macos
          path: server/dist/motility-analyzer
          retention-days: 7

      - name: Upload Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: motility-analyzer-windows
          path: server/dist/motility-analyzer.exe
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: motility-analyzer-macos
          path: artifacts/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: motility-analyzer-windows
          path: artifacts/windows

      - name: Extract tag name
        id: tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: |
            artifacts/macos/motility-analyzer
            artifacts/windows/motility-analyzer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
